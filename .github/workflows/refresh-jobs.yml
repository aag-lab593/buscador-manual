name: Actualizar vacantes del Buscador Manual
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12,20 * * *'
permissions:
  contents: write
concurrency:
  group: manual-search-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fuentes públicas
        run: python scripts/collect_jobs.py
      - name: Publicar resultados si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m "Actualizar datos públicos del buscador" && git push)
